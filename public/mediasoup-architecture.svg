<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 286" width="960" height="286" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="286" fill="#ffffff"/>

  <!-- Worker -->
  <rect x="240" y="24" width="480" height="260" rx="8" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="256" y="46" font-size="14" fill="#475569">Worker (プロセス)</text>

  <!-- Router -->
  <rect x="264" y="60" width="432" height="200" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="280" y="82" font-size="14" fill="#1d4ed8">Router</text>

  <!-- WebRtcTransport (Producer 側) -->
  <rect x="288" y="102" width="176" height="140" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="376" y="126" font-size="13" fill="#1d4ed8" text-anchor="middle">WebRtcTransport</text>
  <rect x="304" y="142" width="144" height="50" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="376" y="173" font-size="15" fill="#78350f" text-anchor="middle">Producer</text>

  <!-- WebRtcTransport (Consumer 側) -->
  <rect x="496" y="102" width="176" height="140" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="584" y="126" font-size="13" fill="#1d4ed8" text-anchor="middle">WebRtcTransport</text>
  <rect x="512" y="142" width="144" height="50" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="584" y="173" font-size="15" fill="#14532d" text-anchor="middle">Consumer</text>

  <!-- Producer -> Consumer (復号済み RTP) -->
  <line x1="448" y1="167" x2="510" y2="167" stroke="#16a34a" stroke-width="2" marker-end="url(#arwg)"/>

  <!-- Browser (送信側) -->
  <rect x="24" y="102" width="176" height="140" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="112" y="126" font-size="13" fill="#475569" text-anchor="middle">ブラウザ</text>
  <rect x="40" y="142" width="144" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="112" y="173" font-size="12.5" fill="#334155" text-anchor="middle">RTCPeerConnection</text>

  <!-- Browser (受信側) -->
  <rect x="760" y="102" width="176" height="140" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="848" y="126" font-size="13" fill="#475569" text-anchor="middle">ブラウザ</text>
  <rect x="776" y="142" width="144" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="848" y="173" font-size="12.5" fill="#334155" text-anchor="middle">RTCPeerConnection</text>

  <!-- SRTP arrows -->
  <line x1="200" y1="167" x2="286" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>
  <text x="243" y="158" font-size="11.5" fill="#475569" text-anchor="middle">SRTP</text>
  <line x1="672" y1="167" x2="758" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>
  <text x="715" y="158" font-size="11.5" fill="#475569" text-anchor="middle">SRTP</text>
</svg>
