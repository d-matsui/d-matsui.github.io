<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1000" width="1150" height="1000" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db2777"/>
    </marker>
    <marker id="mN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="mD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <style>
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #334155; }
      .c1 { fill: #15803d }
      .c2 { fill: #0284c7 }
      .c3 { fill: #7c3aed }
      .c4 { fill: #db2777 }
      .mn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1150" height="1000" fill="#ffffff"/>

  <line x1="320" y1="62" x2="320" y2="992" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="850" y1="62" x2="850" y2="992" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

  <rect x="196" y="16" width="248" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="44" font-size="14" fill="#334155" text-anchor="middle">ブラウザ (mediasoup-client)</text>
  <rect x="700" y="16" width="300" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="850" y="44" font-size="14" fill="#334155" text-anchor="middle">サーバー (mediasoup)</text>

  <rect x="640" y="80" width="490" height="50" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text class="code" x="654" y="101">const worker = await mediasoup.createWorker()</text>
  <text class="code" x="654" y="119">const router = await worker.createRouter()</text>

  <line x1="320" y1="162" x2="848" y2="162" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#mN)"/>
  <text x="584" y="154" font-size="12.5" fill="#64748b" text-anchor="middle">rtpCapabilities を要求</text>

  <line x1="850" y1="196" x2="322" y2="196" stroke="#15803d" stroke-width="1.8" marker-end="url(#m1)"/>
  <text x="584" y="188" font-size="12.5" fill="#15803d" text-anchor="middle">router.rtpCapabilities</text>

  <rect x="20" y="218" width="560" height="50" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text class="code" x="34" y="239">const device = new Device()</text>
  <text class="code" x="34" y="257">await device.load({ <tspan class="c1">routerRtpCapabilities</tspan> })</text>

  <line x1="320" y1="300" x2="848" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#mN)"/>
  <text x="584" y="292" font-size="12.5" fill="#64748b" text-anchor="middle">Transport の作成を要求</text>

  <rect x="640" y="322" width="490" height="32" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text class="code" x="654" y="343">const transport = await router.createWebRtcTransport(...)</text>

  <line x1="850" y1="386" x2="322" y2="386" stroke="#0284c7" stroke-width="1.8" marker-end="url(#m2)"/>
  <text x="584" y="378" font-size="12.5" fill="#0284c7" text-anchor="middle">transport.id, .iceParameters, .iceCandidates, .dtlsParameters</text>

  <rect x="20" y="408" width="560" height="68" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text class="code" x="34" y="429">const sendTransport = device.createSendTransport({</text>
  <text class="code" x="48" y="447"><tspan class="c2">id</tspan>, <tspan class="c2">iceParameters</tspan>, <tspan class="c2">iceCandidates</tspan>, <tspan class="c2">dtlsParameters</tspan>,</text>
  <text class="code" x="34" y="465">})</text>

  <rect x="20" y="494" width="560" height="50" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text class="code" x="34" y="515">const stream = await navigator.mediaDevices.getUserMedia({ video: true })</text>
  <text class="code" x="34" y="533">const track = stream.getVideoTracks()[0]</text>

  <rect x="20" y="562" width="560" height="32" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text class="code" x="34" y="583" fill="#78350f">const producer = await sendTransport.produce({ track })</text>
  <rect x="313" y="594" width="14" height="338" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>

  <path d="M 327 618 L 360 618 L 360 644 L 331 644" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m3)"/>
  <text x="366" y="636" class="mn">sendTransport.on('connect', ({ <tspan class="c3">dtlsParameters</tspan> }, callback) =&gt; {...})</text>

  <line x1="327" y1="676" x2="848" y2="676" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#m3)"/>
  <text x="587" y="666" font-size="12.5" fill="#7c3aed" text-anchor="middle">dtlsParameters</text>
  <text x="587" y="692" font-size="11" fill="#94a3b8" text-anchor="middle">接続を要求</text>

  <rect x="640" y="698" width="490" height="32" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text class="code" x="654" y="719">await transport.connect({ <tspan class="c3">dtlsParameters</tspan> })</text>

  <line x1="850" y1="762" x2="329" y2="762" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mN)"/>
  <text x="587" y="752" font-size="12.5" fill="#64748b" text-anchor="middle">ok</text>
  <text x="587" y="778" font-size="11" fill="#94a3b8" text-anchor="middle">callback() を呼ぶ</text>

  <path d="M 327 788 L 360 788 L 360 814 L 331 814" fill="none" stroke="#db2777" stroke-width="1.6" marker-end="url(#m4)"/>
  <text x="366" y="806" class="mn">sendTransport.on('produce', ({ <tspan class="c4">kind</tspan>, <tspan class="c4">rtpParameters</tspan> }, callback) =&gt; {...})</text>

  <line x1="327" y1="846" x2="848" y2="846" stroke="#db2777" stroke-width="1.8" marker-end="url(#m4)"/>
  <text x="587" y="836" font-size="12.5" fill="#db2777" text-anchor="middle">kind, rtpParameters</text>
  <text x="587" y="862" font-size="11" fill="#94a3b8" text-anchor="middle">Producer の作成を要求</text>

  <rect x="640" y="868" width="490" height="32" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text class="code" x="654" y="889">const producer = await transport.produce({ <tspan class="c4">kind</tspan>, <tspan class="c4">rtpParameters</tspan> })</text>

  <line x1="850" y1="932" x2="329" y2="932" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#mN)"/>
  <text x="587" y="922" font-size="12.5" fill="#64748b" text-anchor="middle">producer.id</text>
  <text x="587" y="948" font-size="11" fill="#94a3b8" text-anchor="middle">callback({ id }) を呼ぶ → produce() が Producer を返す</text>

  <line x1="320" y1="972" x2="848" y2="972" stroke="#0f172a" stroke-width="3.5" marker-end="url(#mD)"/>
  <text x="584" y="962" font-size="13" fill="#0f172a" text-anchor="middle">SRTP</text>
</svg>
